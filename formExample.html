<!DOCTYPE html>
<html>
<head>
	<script>
	async function submitForm(type){
		const User = String(document.getElementById("username").value);
		const Discord = String(document.getElementById("handle").value);
		const Description = String(document.getElementById("description").value);

		const response = await fetch(`http://127.0.0.1:8000/submit?type=${type}&username=${User}&handle=${Discord}&description=${Description}`, {
			method: "POST",
			headers: {"MOONDUST_FORM_SUBMISSION": "true"}
        });
        if(response.status == 429){
            alert("You have been rate limited, please wait before submitting again.");
        };
	}
</script>
</head>
<body>
	<form onsubmit="submitForm('creativePlots'); return false;">
		<label for="username">Minecraft Username</label><br>
		<input type="text" id="username" name="username" value="John"><br>
		<label for="handle">Discord Username</label><br>
		<input type="text" id="handle" name="handle" value="JohnDiscord"><br>
		<label for="description">Describe who you are and what makes you interested in Creative plots!</label><br>
		<input type="text" id="description" name="description" value="Im John"><br>
		<input type="submit" value="Submit">
	</form><br><br>
	<form onsubmit="submitForm('tinySurvival'); return false;">
		<label for="username">Minecraft Username</label><br>
		<input type="text" id="username" name="username" value="John"><br>
		<label for="handle">Discord Username</label><br>
		<input type="text" id="handle" name="handle" value="JohnDiscord"><br>
		<label for="description">Describe who you are and what makes you interested in Tiny Survival!</label><br>
		<input type="text" id="description" name="description" value="Im John"><br>
		<input type="submit" value="Submit">
	</form>
    	<form onsubmit="submitForm('buildComp'); return false;">
		<label for="username">Minecraft Username</label><br>
		<input type="text" id="username" name="username" value="John"><br>
        <input type="submit" value="Submit">
	</form>
</body>
</html>
